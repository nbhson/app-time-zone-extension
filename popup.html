<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="./styles/lib/bootstrap.min.css">
        <link rel="stylesheet" href="./styles/popup.css">
        <title>Chronos Time</title>
    </head>
    <body>
        <div class="app-container">
            <!-- Header -->
            <header class="app-header d-flex justify-content-between align-items-center">
                <div class="brand d-flex align-items-center gap-2">
                    <div class="brand-logo-container">
                        <img src="./images/icon.png" alt="Logo" class="brand-logo">
                    </div>
                    <div>
                        <h1 class="brand-name m-0">Chronos</h1>
                        <p class="brand-sub m-0">Time Zone Converter</p>
                    </div>
                </div>
                
                <div class="header-controls d-flex align-items-center gap-3">
                    <!-- Format Toggle Switch: Left = 24h, Right = 12h -->
                    <div class="format-toggle-container" title="Toggle 12h/24h format">
                        <input type="checkbox" id="format-checkbox" class="toggle-checkbox">
                        <label for="format-checkbox" class="toggle-label">
                            <span class="toggle-inner"></span>
                            <span class="toggle-switch"></span>
                        </label>
                    </div>
                    <!-- Live Status Indicator -->
                    <div class="live-indicator-container d-flex align-items-center gap-2" id="live-indicator" title="Click to resume live clock">
                        <span class="live-dot pulse"></span>
                        <span class="live-text">LIVE</span>
                    </div>
                </div>
            </header>

            <!-- Interactive Time Converter Card -->
            <div class="converter-panel card-glass mb-3">
                <div class="panel-header d-flex justify-content-between align-items-center mb-2">
                    <span>Interactive Converter</span>
                    <button id="btn-sync-time" class="btn-sync d-none" title="Sync to live current time">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                        <span>Sync Live</span>
                    </button>
                </div>
                <div class="slider-display-container d-flex align-items-end justify-content-between">
                    <span id="slider-time-label" class="slider-time-val">12:00 PM</span>
                    <span id="slider-date-label" class="slider-date-val">Saturday, Jun 27</span>
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="time-slider" min="0" max="1439" value="720" step="5" class="time-range-slider">
                </div>
            </div>

            <!-- Search & Add Timezone Autocomplete -->
            <div class="search-panel mb-3 position-relative">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="timezone-search" class="search-input" placeholder="Search & add city or timezone..." autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
                    <button id="clear-search-btn" class="clear-btn d-none">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <!-- Autocomplete Dropdown Options -->
                <div id="search-results" class="autocomplete-dropdown" role="listbox" aria-label="Timezone suggestions"></div>
            </div>

            <!-- Dynamic Time Cards List -->
            <div class="timezones-container">
                <div class="list-header d-flex justify-content-between align-items-center mb-2">
                    <span class="list-title">Time Zones <span id="zone-count" class="zone-count"></span></span>
                    <div class="d-flex align-items-center gap-2">
                        <button id="btn-planner" class="header-btn" title="Toggle meeting planner" aria-pressed="false" aria-label="Toggle meeting planner">
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        </button>
                        <button id="btn-copy-all" class="header-btn" title="Copy all times to clipboard" aria-label="Copy all times to clipboard">
                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>
                <div id="timezone-list" class="timezone-list-grid">
                    <!-- Cards will be dynamically injected here by popup.js -->
                </div>
            </div>

            <!-- Meeting Planner Grid (F2) -->
            <section id="planner-section" class="planner-section card-glass mt-3 d-none">
                <div class="panel-header d-flex justify-content-between align-items-center mb-2">
                    <span id="planner-title">Meeting Planner</span>
                    <button id="planner-toggle" class="btn-sync" aria-expanded="false" aria-controls="planner-grid" title="Collapse meeting planner">
                        <span>Collapse</span>
                    </button>
                </div>
                <div id="planner-grid" class="planner-grid"></div>
                <div class="planner-legend" aria-hidden="true">
                    <span class="legend-chip legend-work">Work</span>
                    <span class="legend-chip legend-evening">Evening</span>
                    <span class="legend-chip legend-night">Night</span>
                </div>
            </section>

            <!-- Footer -->
            <footer class="app-footer d-flex justify-content-between align-items-center mt-3 pt-3 border-top-glass">
                <span class="dev-credit">Crafted by Son Nguyen</span>
                <span class="app-version">v1.3.0</span>
            </footer>
        </div>

        <!-- Script files -->
        <script src="./scripts/lib/moment.min.js"></script>
        <script src="./scripts/lib/moment-timezone-with-data.min.js"></script>
        <script src="./scripts/popup.js" type="module"></script>
    </body>
</html>
